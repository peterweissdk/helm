# Number of pod replicas
replicaCount: 1

# Container image configuration
image:
  repository: ghcr.io/291-group/lan-orangutan
  pullPolicy: IfNotPresent
  tag: ""

# Secrets for pulling images from private registries
imagePullSecrets: []
# Override the chart name
nameOverride: ""
# Override the full resource name (ignores release name)
fullnameOverride: ""

# Use the host's network namespace
hostNetwork: true

# Environment variables passed to the container
env:
  ORANGUTAN_PORT: "291"
  TZ: "UTC"

# Container security context
securityContext:
  capabilities:
    add:
      - NET_RAW
      - NET_ADMIN
      - NET_BIND_SERVICE

# Service configuration
service:
  enabled: true
  type: ClusterIP
  port: 291
  targetPort: 291

# Persistence configuration
# Set enabled=true and hostPath.enabled=false to use PVC
# Set hostPath.enabled=true to use hostPath volume
persistence:
  enabled: true
  name: ""
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi
  existingClaim: ""
  hostPath:
    enabled: false
    path: /var/lib/lan-orangutan
    type: DirectoryOrCreate

# Liveness probe - restarts container if it fails
livenessProbe:
  enabled: true
  httpGet:
    path: /static/orangutan.svg
    port: 291
  initialDelaySeconds: 5
  periodSeconds: 30
  timeoutSeconds: 3
  failureThreshold: 3

# Readiness probe - removes pod from service if it fails
readinessProbe:
  enabled: false
  httpGet:
    path: /static/orangutan.svg
    port: 291
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# Container resource requests and limits
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi

# Node labels for pod assignment
nodeSelector: {}

# Tolerations for pod scheduling
tolerations: []

# Affinity rules for pod scheduling
# podAntiAffinity prefers scheduling pods on different nodes
affinity:
  podAntiAffinity:
    enabled: false
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: lan-orangutan
          topologyKey: kubernetes.io/hostname
