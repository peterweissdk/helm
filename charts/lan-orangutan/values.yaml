replicaCount: 1

image:
  repository: ghcr.io/291-group/lan-orangutan
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

hostNetwork: true

env:
  ORANGUTAN_PORT: "291"
  TZ: "UTC"

securityContext:
  capabilities:
    add:
      - NET_RAW
      - NET_ADMIN
      - NET_BIND_SERVICE

service:
  enabled: true
  type: ClusterIP
  port: 291
  targetPort: 291

persistence:
  enabled: false
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi
  existingClaim: ""
  hostPath:
    enabled: true
    path: /var/lib/lan-orangutan
    type: DirectoryOrCreate

livenessProbe:
  enabled: true
  httpGet:
    path: /static/orangutan.svg
    port: 291
  initialDelaySeconds: 5
  periodSeconds: 30
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  enabled: false
  httpGet:
    path: /static/orangutan.svg
    port: 291
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}
